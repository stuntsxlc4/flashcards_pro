name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday at 03:17 UTC; GitHub runs schedules from the default branch.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate required repository files
        run: |
          set -Eeuo pipefail
          required_files=(
            "README.md" "compose.yaml" "contracts/README.md"
            "infrastructure/README.md" "deploy/helm/README.md"
            "deploy/terraform/README.md" "docs/README.md"
            "docs/service-lifecycle.md" "adr/README.md" "scripts/README.md"
            "scripts/create-service.sh" "scripts/check-service-boundaries.py"
            "security/policy.json" "security/exceptions.json"
            "security/tools.lock.json" "security/gitleaks.toml"
            ".ci/security-tools/pyproject.toml" ".ci/security-tools/uv.lock"
            "docs/security-quality-gates.md"
            "contracts/registry.json" "docs/contract-registry.md"
            "contracts/support.json" "docs/contract-compatibility.md"
            "compose.contracts.yaml"
            "docs/path-aware-ci.md" "scripts/ci/plan.py" "scripts/ci/run_integration.py"
          )
          for required_file in "${required_files[@]}"; do
            if [[ ! -s "$required_file" ]]; then
              echo "::error file=${required_file}::Required file is missing or empty"
              exit 1
            fi
          done

      - name: Validate service generator syntax and executable permission
        run: |
          bash -n scripts/create-service.sh
          test -x scripts/create-service.sh

      - name: Check service boundaries
        run: python3 scripts/check-service-boundaries.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: .ci/security-tools/uv.lock

      - name: Validate security policy and exceptions
        run: uv run --project .ci/security-tools --frozen python -m scripts.security.gate validate-policy --root .

  discover-services:
    name: Discover services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      services: ${{ steps.discover.outputs.services }}
      targets: ${{ steps.discover.outputs.targets }}
      images: ${{ steps.discover.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: .ci/security-tools/uv.lock

      - name: Write expected target manifest and matrices
        id: discover
        run: |
          uv run --project .ci/security-tools --frozen python -m scripts.security.discover_targets \
            --root . --output reports/manifest.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload expected manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-manifest
          path: reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  service-quality:
    name: Quality — ${{ matrix.target }}
    needs: [discover-services]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover-services.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install locked CI tools
        run: uv sync --project .ci/security-tools --frozen

      - name: Run tests, lint, types and documentation; record test evidence
        env:
          TARGET_ID: ${{ matrix.target }}
        run: |
          uv run --project .ci/security-tools --frozen python \
            -m scripts.security.run_scans --phase tests \
            --root . --target "$TARGET_ID" --output reports

      - name: Lint and format-check repository automation
        if: ${{ !cancelled() && matrix.target == 'repo-security-tools' }}
        run: |
          uv run --project .ci/security-tools --frozen ruff check \
            --config .ci/security-tools/pyproject.toml scripts/security scripts/contracts scripts/ci scripts/tests
          uv run --project .ci/security-tools --frozen ruff format --check \
            --config .ci/security-tools/pyproject.toml scripts/security scripts/contracts scripts/ci scripts/tests

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-tests-${{ matrix.target }}
          path: reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  execution-plan:
    name: Integration impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: .ci/security-tools/uv.lock
      - name: Compute impact from Git and current validated inventories
        id: plan
        run: |
          uv run --project .ci/security-tools --frozen python -m scripts.ci.plan \
            --root . --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-execution-plan
          path: reports/ci-plan.json
          if-no-files-found: error
          retention-days: 7

  selected-integration:
    name: Runtime integration — ${{ matrix.target }}
    needs: [execution-plan]
    # Guard at job level before evaluating an empty matrix. Full baseline jobs are not filtered.
    if: needs.execution-plan.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.execution-plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-execution-plan
          path: reports
      - name: Recompute plan, validate selected project and install its locked environment
        env:
          TARGET_ID: ${{ matrix.target }}
        run: |
          uv run --project .ci/security-tools --frozen python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from scripts.ci.plan import expected_plan
          root = Path.cwd()
          plan = expected_plan(root, root / "reports/ci-plan.json")
          target_id = os.environ["TARGET_ID"]
          if target_id not in plan["selected"]:
              raise SystemExit("Target is not required by recomputed plan")
          target = next(target for target in plan["targets"] if target["id"] == target_id)
          subprocess.run(["uv", "sync", "--project", target["path"], "--all-groups", "--frozen"], check=True)
          PY
      - name: Run actual lifecycle, PostgreSQL migrations and rollback checks where supported
        env:
          TARGET_ID: ${{ matrix.target }}
        run: |
          uv run --project .ci/security-tools --frozen python -m scripts.ci.run_integration run \
            --root . --target "$TARGET_ID"
      - name: Upload integration evidence, including failed tests
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-runtime-${{ matrix.target }}
          path: reports/integration/
          if-no-files-found: error
          retention-days: 7

  integration-evidence:
    name: Verify selected integration evidence
    if: always()
    needs: [execution-plan, selected-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: .ci/security-tools/uv.lock
      - name: Reject failed planner or required integration job
        env:
          PLAN_RESULT: ${{ needs.execution-plan.result }}
          INTEGRATION_RESULT: ${{ needs.selected-integration.result }}
          HAS_TARGETS: ${{ needs.execution-plan.outputs.has_targets }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$HAS_TARGETS" == true ]]; then
            test "$INTEGRATION_RESULT" = success
          elif [[ "$HAS_TARGETS" == false ]]; then
            test "$INTEGRATION_RESULT" = skipped
          else
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-execution-plan
          path: reports
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.execution-plan.outputs.has_targets == 'true'
        with:
          pattern: ci-runtime-*
          path: reports/integration
          merge-multiple: true
      - name: Independently recompute expected selection and verify exact evidence
        run: |
          uv run --project .ci/security-tools --frozen python -m scripts.ci.run_integration verify --root .

  contract-registry:
    name: Contract registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: |
            .ci/security-tools/uv.lock
            services/content-service/uv.lock

      - name: Install locked contract tools and reference service
        run: |
          uv sync --project .ci/security-tools --frozen
          uv sync --project services/content-service --all-groups --frozen

      - name: Validate registry and require reproducible committed outputs
        run: |
          uv run --project .ci/security-tools --no-sync python -m scripts.contracts.validate --root .
          uv run --project .ci/security-tools --no-sync python -m scripts.contracts.build --root . --check

      - name: Exercise actual API and generated transport models
        run: |
          uv run --project .ci/security-tools --no-sync python -m pytest \
            -c .ci/security-tools/pyproject.toml scripts/tests/integration/test_contract_registry.py \
            --junitxml=reports/contracts/junit.xml

      - name: Publish browsable contract reference and test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contract-registry-reference
          path: |
            contracts/generated/docs/
            reports/contracts/
          if-no-files-found: error
          retention-days: 30

  contract-compatibility:
    name: Contract compatibility and delivery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: |
            .ci/security-tools/uv.lock
            services/content-service/uv.lock

      - name: Install locked contract tools and reference service
        run: |
          uv sync --project .ci/security-tools --frozen
          uv sync --project services/content-service --all-groups --frozen

      - name: Resolve exact comparison baseline from the triggering event
        id: baseline
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True, timeout=30).strip()

          def exact_commit(value):
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise SystemExit("Expected an exact baseline commit SHA")
              return git("rev-parse", "--verify", value + "^{commit}")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          name = os.environ["GITHUB_EVENT_NAME"]
          if name == "pull_request":
              base = exact_commit(event["pull_request"]["base"]["sha"])
              head = exact_commit(event["pull_request"]["head"]["sha"])
              baseline = git("merge-base", base, head)
          elif name == "push":
              baseline = exact_commit(event["before"])
          else:
              # Manual/scheduled runs repeat every fixture and compare the last change.
              baseline = git("rev-parse", "--verify", "HEAD^1")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("sha=" + exact_commit(baseline) + "\n")
          print("Contract baseline:", baseline)
          PY

      - name: Reject breaking changes to supported contracts
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          uv run --project .ci/security-tools --no-sync python \
            -m scripts.contracts.compatibility --root . --base "$BASE_SHA" \
            --install-tools --output reports/contracts/compatibility.json

      - name: Exercise every reference binding and real JetStream failure scenarios
        if: ${{ !cancelled() }}
        run: |
          uv run --project .ci/security-tools --no-sync python -m pytest \
            -c .ci/security-tools/pyproject.toml \
            scripts/tests/integration/test_contract_registry.py \
            scripts/tests/integration/test_contract_delivery.py \
            --junitxml=reports/contracts/delivery-junit.xml

      - name: Publish compatibility and delivery results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contract-compatibility-results
          path: reports/contracts/
          if-no-files-found: error
          retention-days: 30

  python-security:
    name: Dependencies and licenses — ${{ matrix.target }}
    needs: [discover-services]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover-services.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install locked CI tools
        run: uv sync --project .ci/security-tools --frozen

      - name: Audit every locked dependency group and Python package license
        env:
          TARGET_ID: ${{ matrix.target }}
        run: |
          uv run --project .ci/security-tools --frozen python \
            -m scripts.security.run_scans --phase python \
            --root . --target "$TARGET_ID" --output reports --install-tools

      - name: Upload dependency and license evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-python-${{ matrix.target }}
          path: reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  repository-security:
    name: Secrets, IaC and Compose security
    needs: [discover-services]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: .ci/security-tools/uv.lock

      - name: Install locked CI tools
        run: uv sync --project .ci/security-tools --frozen

      - name: Scan full repository
        run: |
          uv run --project .ci/security-tools --frozen python \
            -m scripts.security.run_scans --phase repository \
            --root . --output reports --install-tools

      - name: Upload redacted repository evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-repository
          path: reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  service-container:
    name: Container — ${{ matrix.target }}
    needs: [discover-services]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover-services.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: .ci/security-tools/uv.lock

      - name: Install locked CI tools
        run: uv sync --project .ci/security-tools --frozen

      - name: Resolve image build context from manifest
        id: context
        env:
          TARGET_ID: ${{ matrix.target }}
        run: |
          uv run --project .ci/security-tools --frozen python - <<'PY'
          import os
          from pathlib import Path
          from scripts.security.discover_targets import discover

          manifest = discover(Path.cwd())
          target = next(t for t in manifest["targets"] if t["id"] == os.environ["TARGET_ID"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={target['path']}\n")
          PY

      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image once, restore layers and load the exact tested image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.context.outputs.path }}
          load: true
          push: false
          tags: flashcards-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=fcb-${{ matrix.target }}-${{ runner.arch }}
          # PRs (including forks) may restore eligible base-branch cache, but never save it.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=min,scope=fcb-{0}-{1}', matrix.target, runner.arch) || '' }}
          provenance: false
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Record immutable local image ID
        id: image-id
        env:
          IMAGE_TAG: flashcards-${{ matrix.target }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          echo "id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Run container smoke test against the same image
        env:
          IMAGE_ID: ${{ steps.image-id.outputs.id }}
        run: |
          set -Eeuo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1::8000 \
            --env APP_ENVIRONMENT=test "$IMAGE_ID")"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          host_port="$(docker inspect \
            --format '{{(index (index .NetworkSettings.Ports "8000/tcp") 0).HostPort}}' \
            "$container_id")"
          curl --fail --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            "http://127.0.0.1:${host_port}/health/live"
          curl --fail --show-error "http://127.0.0.1:${host_port}/health/ready"
          curl --fail --show-error "http://127.0.0.1:${host_port}/api/v1/status"
          docker stop --time 10 "$container_id"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container_id")"
          if [[ "$exit_code" != "0" ]]; then
            echo "::error::Container exited with code ${exit_code}"
            exit 1
          fi

      - name: Scan built image and export SBOM even if smoke test failed
        if: ${{ !cancelled() && steps.image-id.outcome == 'success' }}
        env:
          TARGET_ID: ${{ matrix.target }}
          IMAGE_ID: ${{ steps.image-id.outputs.id }}
        run: |
          uv run --project .ci/security-tools --frozen python \
            -m scripts.security.run_scans --phase image --root . \
            --target "$TARGET_ID" --image "$IMAGE_ID" --output reports --install-tools

      - name: Upload image scan and SBOM evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-image-${{ matrix.target }}
          path: reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  template-conformance:
    name: Template conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: templates/fastapi-microservice/uv.lock

      - name: Generate sample service
        run: |
          set -Eeuo pipefail
          bash -n scripts/create-service.sh
          ./scripts/create-service.sh ci-sample-service "CI Sample Service" \
            --owner platform-team --output "$RUNNER_TEMP/ci-sample-service"

      - name: Validate generated structure and excluded local evidence
        run: |
          set -Eeuo pipefail
          generated="$RUNNER_TEMP/ci-sample-service"
          required_files=(
            "pyproject.toml" "uv.lock" "Dockerfile" "README.md" "OWNERS.yaml"
            "TEMPLATE_METADATA.yaml" "Makefile" ".env.example" "src/app/main.py"
          )
          for required_file in "${required_files[@]}"; do
            if [[ ! -s "${generated}/${required_file}" ]]; then
              echo "::error::Generated file is missing or empty: ${required_file}"
              exit 1
            fi
          done
          for excluded in .git .github .venv .tox reports .coverage coverage.xml coverage.json htmlcov compose.yaml deploy; do
            test ! -e "${generated}/${excluded}"
          done
          if rg -n --glob '!README.md' --glob '!TEMPLATE_METADATA.yaml' \
            "FastAPI Microservice|fastapi-microservice" "$generated"; then
            echo "::error::Unresolved template identity found"
            exit 1
          fi

      - name: Test generated service
        working-directory: ${{ runner.temp }}/ci-sample-service
        run: |
          set -Eeuo pipefail
          uv lock --check
          uv sync --all-groups --frozen
          make lint
          make format-check
          make typecheck
          make test
          make docs

      - name: Build generated service image
        working-directory: ${{ runner.temp }}/ci-sample-service
        env:
          IMAGE_TAG: flashcards-ci-sample:${{ github.sha }}
        run: make image-build IMAGE="$IMAGE_TAG"

  scanner-self-tests:
    name: Scanner negative integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: .ci/security-tools/uv.lock

      - name: Install locked CI tools
        run: uv sync --project .ci/security-tools --frozen

      - name: Require actual detection of synthetic secret and known vulnerable dependency fixture
        run: |
          uv run --project .ci/security-tools --frozen python \
            -m scripts.security.run_scans --root . --output reports \
            --install-tools --self-test-scanners

      - name: Upload scanner self-test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scanner-self-test-results
          path: reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  security-and-coverage:
    name: Security policy and aggregate coverage
    if: always()
    needs:
      - discover-services
      - service-quality
      - python-security
      - repository-security
      - service-container
      - scanner-self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          cache-dependency-glob: .ci/security-tools/uv.lock

      - name: Download evidence from this workflow run only
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: evidence-*
          path: reports
          merge-multiple: true

      - name: Verify complete scan evidence and evaluate policy
        if: ${{ !cancelled() }}
        run: |
          uv run --project .ci/security-tools --frozen python -m scripts.security.gate evaluate --root . \
            --manifest reports/manifest.json --reports reports

      - name: Aggregate exact line and branch counters
        if: ${{ !cancelled() }}
        run: |
          uv run --project .ci/security-tools --frozen python -m scripts.security.aggregate_coverage \
            --root . --manifest reports/manifest.json --reports reports

      - name: Publish evaluated evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-quality-results
          path: reports/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 90 || 30 }}

  ci-success:
    name: CI success
    if: always()
    needs:
      - repository-checks
      - discover-services
      - service-quality
      - python-security
      - repository-security
      - service-container
      - template-conformance
      - scanner-self-tests
      - security-and-coverage
      - contract-registry
      - contract-compatibility
      - execution-plan
      - integration-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed, including evidence aggregation
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required jobs did not succeed: " + ", ".join(failed))
          print("All required repository, quality, security and conformance checks passed.")
          PY
