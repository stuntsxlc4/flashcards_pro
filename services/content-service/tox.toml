requires = ["tox>=4.60,<5", "tox-uv>=1.36,<2"]
env_list = ["py314", "lint", "type", "docs"]
no_package = true

[env_run_base]
commands = [
    ["pytest", { replace = "posargs", default = [], extend = true }],
]
dependency_groups = ["dev"]
description = "run the unit test suite with coverage"
runner = "uv-venv-lock-runner"

[env.lint]
commands = [
    ["ruff", "check"],
    ["ruff", "format", "--check"],
]
description = "run Ruff lint and formatting checks"

[env.type]
commands = [["pyright"]]
description = "run strict Pyright checks"

[env.docs]
commands = [
    [
        "sphinx-build",
        "-E",
        "-a",
        "-W",
        "--keep-going",
        "-b",
        "html",
        "docs",
        "docs/_build/html",
    ],
]
dependency_groups = ["docs"]
description = "build Sphinx documentation with warnings as errors"
