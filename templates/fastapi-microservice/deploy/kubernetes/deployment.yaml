apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-microservice
  labels:
    app.kubernetes.io/name: fastapi-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-microservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-microservice
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/your-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENVIRONMENT
              value: production
            - name: APP_DOCS_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-microservice
  labels:
    app.kubernetes.io/name: fastapi-microservice
spec:
  selector:
    app.kubernetes.io/name: fastapi-microservice
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
