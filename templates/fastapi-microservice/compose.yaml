name: fastapi-microservice

services:
  api:
    build:
      context: .
    init: true
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: local
      APP_DOCS_ENABLED: "true"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
